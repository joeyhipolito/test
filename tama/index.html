<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Tama! canvas Tama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4ecdf;
    --paper-2: #ebe1d0;
    --ink: #3a2a22;
    --muted: #8a776a;
    --chip: #fffaf2;
    --chip-edge: #d9ccb8;
    --accent: #e86f4c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; padding: 18px 16px 40px; }
  header { width: 100%; max-width: 640px; display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: .3px; }
  header span { color: var(--muted); font-size: 13px; }
  .stage { position: relative; width: 100%; max-width: 600px; }
  canvas { display: block; width: 100%; height: auto; border-radius: 22px;
    background: var(--paper-2); box-shadow: 0 10px 30px rgba(60,40,20,.12), inset 0 0 0 1px rgba(60,40,20,.06);
    cursor: pointer; touch-action: manipulation; }
  .hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .controls { width: 100%; max-width: 600px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .row .label { font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); width: 58px; }
  button { font: inherit; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--chip);
    border: 1px solid var(--chip-edge); border-radius: 999px; padding: 6px 12px; cursor: pointer;
    box-shadow: 0 1px 0 rgba(60,40,20,.08); }
  button:hover { border-color: #b9a88f; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button small { font-weight: 600; color: var(--muted); margin-right: 4px; }
  button.primary small { color: rgba(255,255,255,.8); }
  .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--chip-edge); }
  .swatch.on { box-shadow: 0 0 0 2px var(--ink); }
  details { width: 100%; max-width: 600px; margin-top: 12px; font-size: 12px; color: var(--muted); }
  pre { background: var(--chip); border: 1px solid var(--chip-edge); border-radius: 12px; padding: 10px 12px;
    font-size: 12px; line-height: 1.5; overflow: auto; color: var(--ink); margin: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<header><h1>Go Tama!</h1><span>one Tama, drawn live in Canvas 2D from a genome</span></header>
<div class="stage">
  <canvas id="tama" width="600" height="560" aria-label="A Tama creature"></canvas>
  <div class="hint">tap the Tama to make it sneeze</div>
</div>
<div class="controls" id="controls">
  <div class="row">
    <button class="primary" id="randomise">Randomise</button>
    <button id="sneeze">Sneeze</button>
    <span class="label" style="width:auto;margin-left:6px">Colour</span>
    <span id="palettes" class="row" style="gap:4px"></span>
  </div>
  <div class="row" id="slots"></div>
</div>
<details><summary>genome</summary><pre id="genomeOut"></pre><div id="stats" style="margin-top:6px"></div></details>

<script>
'use strict';
/* =====================================================================
   Go Tama!  canvas Tama renderer
   All art is procedural: no bitmaps. Everything is drawn in "body units"
   (BU): the reference body is 200 BU wide and 168 BU tall, centred at
   the origin, facing LEFT (-x is forward, +x is the rear, +y is down).
   ===================================================================== */

/* ---------- seeded randomness and noise ---------- */
function hash32(n) { n = (n ^ 61) ^ (n >>> 16); n = Math.imul(n, 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
function rng(seed) { let s = hash32(seed | 0) || 1; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// smooth 1D value noise in [-1,1]
function noise1(seed, x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  const a = hash32(seed * 7919 + i * 131) / 4294967296, b = hash32(seed * 7919 + (i + 1) * 131) / 4294967296;
  return (a + (b - a) * u) * 2 - 1;
}
function fbm(seed, x, oct = 3) { let v = 0, amp = 1, f = 1, n = 0; for (let o = 0; o < oct; o++) { v += noise1(seed + o * 17, x * f) * amp; n += amp; amp *= .5; f *= 2.1; } return v / n; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* ---------- colour ---------- */
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join(''); }
function rgbToHsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2; if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h /= 6; } return [h, s, l]; }

function alpha(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
// near-black ink tinted toward the local colour, pulled toward the palette ink
function inkFor(hex, baseInk) { const [h, s] = rgbToHsl(...hexToRgb(hex)); const tinted = rgbToHex(...hslToRgb(h, clamp(s * .8 + .2, 0, .85), .13)); return mix(tinted, baseInk, .45); }

function shadeOf(hex, t) { return adjust(mix(hex, '#2a1208', t), 0, .06, -.015); }

/* ---------- geometry: bezier shapes, flattening, ink ribbons ---------- */
class Shape {

  C(x1, y1, x2, y2, x, y) { this.segs.push({ t: 'C', p0: this.cur, c1: [x1, y1], c2: [x2, y2], p: [x, y] }); this.cur = [x, y]; return this; }
  Q(cx, cy, x, y) { const p0 = this.cur; return this.C(p0[0] + 2 / 3 * (cx - p0[0]), p0[1] + 2 / 3 * (cy - p0[1]), x + 2 / 3 * (cx - x), y + 2 / 3 * (cy - y), x, y); }

  static ellipse(cx, cy, rx, ry, rot = 0) { const k = .5523; const s = new Shape(); const pts = []; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; pts.push([Math.cos(a), Math.sin(a)]); } const tr = (x, y) => { const X = x * rx, Y = y * ry; return [cx + X * Math.cos(rot) - Y * Math.sin(rot), cy + X * Math.sin(rot) + Y * Math.cos(rot)]; }; s.M(...tr(1, 0)); for (let i = 0; i < 4; i++) { const a0 = i * Math.PI / 2, a1 = a0 + Math.PI / 2; const p0 = [Math.cos(a0), Math.sin(a0)], p1 = [Math.cos(a1), Math.sin(a1)]; s.C(...tr(p0[0] - p0[1] * k, p0[1] + p0[0] * k), ...tr(p1[0] + p1[1] * k, p1[1] - p1[0] * k), ...tr(p1[0], p1[1])); } return s.Z(); }

      const [p0, c1, c2, p] = [s.p0, s.c1, s.c2, s.p];
      const len = Math.hypot(c1[0] - p0[0], c1[1] - p0[1]) + Math.hypot(c2[0] - c1[0], c2[1] - c1[1]) + Math.hypot(p[0] - c2[0], p[1] - c2[1]);
      const n = Math.max(2, Math.ceil(len / step));
      for (let i = 0; i < n; i++) {

        const x = mt * mt * mt * p0[0] + 3 * mt * mt * t * c1[0] + 3 * mt * t * t * c2[0] + t * t * t * p[0];
        const y = mt * mt * mt * p0[1] + 3 * mt * mt * t * c1[1] + 3 * mt * t * t * c2[1] + t * t * t * p[1];
        let dx = 3 * mt * mt * (c1[0] - p0[0]) + 6 * mt * t * (c2[0] - c1[0]) + 3 * t * t * (p[0] - c2[0]);
        let dy = 3 * mt * mt * (c1[1] - p0[1]) + 6 * mt * t * (c2[1] - c1[1]) + 3 * t * t * (p[1] - c2[1]);
        if (Math.abs(dx) + Math.abs(dy) < 1e-6) { dx = p[0] - p0[0]; dy = p[1] - p0[1]; }
        const d = Math.hypot(dx, dy) || 1;
        pts.push({ x, y, tx: dx / d, ty: dy / d });

    }
    if (!this.closed) { const s = this.segs[this.segs.length - 1]; const q = pts[pts.length - 1]; pts.push({ x: s.p[0], y: s.p[1], tx: q.tx, ty: q.ty }); }

    let area = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += a.x * b.y - b.x * a.y; }
    const sign = this.closed ? (area > 0 ? 1 : -1) : 1;   // canvas y-down: positive area = clockwise on screen
    let acc = 0;
    for (let i = 0; i < pts.length; i++) { const p = pts[i]; p.nx = p.ty * sign; p.ny = -p.tx * sign; if (i) acc += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y); p.s = acc; }
    return { pts, closed: this.closed, length: acc + (this.closed ? Math.hypot(pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y) : 0) };
  }
}
// outward normals check: for a closed clockwise (screen) polygon, (ty, -tx) points outward
// Build a pressure ribbon Path2D around a flattened polyline.
// opts: w (base width), heavy (extra weight on undersides 0..1), jitter (px), seed, taper ('none'|'both'|'start'|'end'), wobble (width noise 0..1)
function ribbon(fl, opts = {}) {
  const { w = 3, heavy = .5, jitter = .6, seed = 1, taper = 'none', wobble = .12, out = .55 } = opts;
  const pts = fl.pts, n = pts.length, L = fl.length || 1;

    const p = pts[i]; const u = p.s / L;
    let wi = w * (1 + heavy * clamp(p.ny, 0, 1)) * (1 + wobble * fbm(seed, p.s / 14, 2));
    if (!fl.closed) {
      const tl = .12;
      if (taper === 'both' || taper === 'start') wi *= smooth(u / tl);
      if (taper === 'both' || taper === 'end') wi *= smooth((1 - u) / tl);
    }
    const j = jitter * fbm(seed + 3, p.s / 9, 2);
    const cx = p.x + p.nx * j, cy = p.y + p.ny * j;
    outer.push([cx + p.nx * wi * out, cy + p.ny * wi * out]);
    inner.push([cx - p.nx * wi * (1 - out), cy - p.ny * wi * (1 - out)]);
  }
  const path = new Path2D();
  path.moveTo(outer[0][0], outer[0][1]);
  for (let i = 1; i < n; i++) path.lineTo(outer[i][0], outer[i][1]);
  if (fl.closed) { path.closePath(); path.moveTo(inner[n - 1][0], inner[n - 1][1]); for (let i = n - 2; i >= 0; i--) path.lineTo(inner[i][0], inner[i][1]); path.closePath(); }
  else { for (let i = n - 1; i >= 0; i--) path.lineTo(inner[i][0], inner[i][1]); path.closePath(); }
  return path;
}
// memo for geometry built from stable keys
const MEMO = new Map();
let CUR_PAL = null;   // palette of the creature being drawn, lets part shadows share its hue
function memo(key, build) { let v = MEMO.get(key); if (v === undefined) { v = build(); MEMO.set(key, v); } return v; }

// ink an outline: fill a ribbon in colour
function ink(ctx, shapeOrFl, color, opts = {}) {
  const fl = shapeOrFl.pts ? shapeOrFl : shapeOrFl.flatten(opts.step || 2.2);
  const key = opts.key;
  const path = key ? memo('rib:' + key, () => ribbon(fl, opts)) : ribbon(fl, opts);
  ctx.fillStyle = color; ctx.fill(path, 'nonzero');
}
// a tapered brush stroke along a polyline of [x,y] points (for texture strokes)
function strokeShape(pts) { const s = new Shape(); s.M(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) s.L(pts[i][0], pts[i][1]); return s; }
function curve(p0, c1, c2, p1) { return new Shape().M(p0[0], p0[1]).C(c1[0], c1[1], c2[0], c2[1], p1[0], p1[1]); }

/* ---------- soft paint helpers ---------- */
function softEllipse(ctx, x, y, rx, ry, color, a = 1, feather = .55, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(rx, ry);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, alpha(color, a)); g.addColorStop(1 - feather, alpha(color, a * .85)); g.addColorStop(1, alpha(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
}
// crescent shade inside a clip: everything outside an offset inner ellipse gets the shade colour, soft edged
function crescent(ctx, clipPath, cx, cy, r, color, a = 1, ox = -.18, oy = -.22, inner = .72, soft = .14) {
  ctx.save(); ctx.clip(clipPath);
  ctx.translate(cx + ox * r, cy + oy * r);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.25);
  g.addColorStop(inner, alpha(color, 0)); g.addColorStop(Math.min(1, inner + soft), alpha(color, a)); g.addColorStop(1, alpha(color, a));

// Axie-style layered shading inside a clip: soft crescent, a harder core shadow a little further in,
// a thin rim light on the lit side and (optionally) a crisp highlight patch with a soft glow.
function shading(ctx, clip, cx, cy, r, o = {}) {

}
function sheen(ctx, clipPath, x, y, rx, ry, a = .16, rot = -.5) {

// cast shadow onto a surface (clipped), multiply so it darkens any colour
function cast(ctx, clipPath, x, y, rx, ry, color, a = .45, rot = 0) {

// short tapered flicks along a flattened outline (fuzz / fur). Batched into one path.
function flickPath(fl, opts) {

  const r = rng(seed); const path = new Path2D(); const pts = fl.pts; const L = fl.length;

// scatter helper inside a clip

function star4(ctx, x, y, r, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .38 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }

/* =====================================================================
   BODY: silhouette, anchors, paint
   ===================================================================== */
const BODY = { rx: 100, ry: 84 };
function bodyPoint(th, edge, seed) {
  const c = Math.cos(th), s = Math.sin(th), n = 2.45;
  let x = Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
  let y = Math.sign(s) * Math.pow(Math.abs(s), 2 / n);

  yy *= 1 - .07 * (x + 1) / 2;                                         // egg: the rear sits a little lower than the head

function bodySilhouette(edge, seed) {

      const col = i % 3 === 0 ? '#ffd86b' : (i % 3 === 1 ? '#ff7a2e' : '#b23b12');
      brush(ctx, new Shape().M(ex, ey).Q(mx, my, ex + Math.cos(ang) * L, ey + Math.sin(ang) * L), col, 1.7, { taper: 'end', jitter: .15 });
      if (k > .5) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ex + Math.cos(ang) * (L + 2.5), ey + Math.sin(ang) * (L + 2.5), 1.1, 0, TAU); ctx.fill(); }
    }
    for (let i = 0; i < 5; i++) { const ph = (tt * (.5 + i * .13) + i * .37) % 1; const ang = i * 1.3 + .4; const d = 10 + ph * 22; ctx.fillStyle = alpha(i % 2 ? '#ffb13b' : '#ff6a1f', (1 - ph) * .9); ctx.beginPath(); ctx.arc(ex + Math.cos(ang) * d + Math.sin(ph * 9 + i) * 3, ey + Math.sin(ang) * d + ph * 8, .9 + (1 - ph) * .9, 0, TAU); ctx.fill(); }
    const g = ctx.createRadialGradient(ex - 1, ey - 1, 0, ex, ey, 6.5); g.addColorStop(0, '#fff6c8'); g.addColorStop(.45, '#ffcf4a'); g.addColorStop(1, '#ff6a1f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 6.2 + .4 * Math.sin(tt * 11), 0, TAU); ctx.fill();
    ink(ctx, Shape.ellipse(ex, ey, 6.4, 6.4), '#b23b12', { w: 1.3, heavy: .5, jitter: .3, seed: 114, step: 1.2 });
  });
});
drawTail.hanamiDango = part({ seat: { rx: 10, ry: 9, a: .4 }, behind: true }, (ctx, a, pal, t) => {
  at(ctx, a.rear, a.pose.tail + .25, () => {
    const skew = new Shape().M(-6, -1.6).L(78, 2.5).L(84, 0).L(78, -2.5).L(-6, 1.6).Z();
    ctx.fillStyle = '#e8d7b0'; ctx.fill(skew.path());
    ink(ctx, new Shape().M(-6, 0).L(84, 0), inkFor('#c9b58a', pal.ink), { w: 5, heavy: .4, jitter: .2, seed: 121, taper: 'end', step: 1.5, out: .5 });
    ctx.fillStyle = '#e8d7b0'; ctx.fill(skew.path());
    const balls = [[15, '#f4a6b8', '#d8778f'], [40, '#fbf4ec', '#dccbbb'], [65, '#b7d27c', '#88a854']];
    for (const [x, c, sh] of balls) {
      const b = Shape.ellipse(x, 0, 12.5, 12);
      solid(ctx, b, c, { shade: sh, ink: inkFor(sh, pal.ink), w: 2.5, cx: x, cy: 0, r: 12.5, ox: -.2, oy: -.3, inner: .62, soft: .24, sheenAt: [x - 4, -4, 3.5, 2.2, .45, -.5], seed: 122 + x });
    }
  });
});
drawTail.fude = part({ seat: { rx: 10, ry: 9, a: .4 }, behind: true }, (ctx, a, pal, t) => {
  at(ctx, a.rear, a.pose.tail + .3, () => {
    const wood = '#a66b3a', wdark = '#6d4222', wlit = '#c68d58';
    const handle = new Shape().M(-6, -4.5).C(14, -5, 34, -4.5, 54, -4.2).C(55, -1.5, 55, 1.5, 54, 4.2).C(34, 4.5, 14, 5, -6, 4.5);
    const hp = handle.path(); const hc = new Path2D(hp); hc.closePath();
    ctx.fillStyle = wood; ctx.fill(hc);
    ctx.save(); ctx.clip(hc); for (let i = 0; i < 4; i++) { const y = -3 + i * 2; brush(ctx, new Shape().M(-4, y).C(14, y - 1 + Math.sin(i) * .8, 34, y + 1, 54, y + .5), alpha(wdark, .5), .8, { taper: 'both' }); } ctx.fillStyle = alpha(wdark, .35); ctx.fillRect(-6, 1.5, 62, 3.5); ctx.restore();
    brush(ctx, new Shape().M(2, -2.4).L(44, -2.2), wlit, 1.4);
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.ellipse(-4, 0, 1.6, 5, 0, 0, TAU); ctx.fill();
    ink(ctx, handle, inkFor(wood, pal.ink), { w: 2.4, heavy: .45, jitter: .3, seed: 131, taper: 'start', step: 1.5 });
    // ferrule band
    ctx.fillStyle = pal.ink; ctx.beginPath(); ctx.ellipse(52, 0, 2.2, 5.4, 0, 0, TAU); ctx.fill();
    // bristle tuft, inked at the tip
    const tuft = new Shape().M(52, -5.2).C(64, -8, 78, -6, 92, 4).C(84, 4, 70, 7.5, 52, 5.2);
    const tp = tuft.path(); const tc = new Path2D(tp); tc.closePath();
    const g = ctx.createLinearGradient(56, 0, 92, 4); g.addColorStop(0, '#f1e7d6'); g.addColorStop(.55, '#e2d3bd'); g.addColorStop(.7, '#5a4a40'); g.addColorStop(1, pal.ink);
    ctx.fillStyle = g; ctx.fill(tc);
    const fl = tuft.flatten(1.6);
    ctx.fillStyle = alpha('#9c8a72', .7); ctx.fill(flickPath(fl, { seed: 132, spacing: 2.6, len: 4, inset: 3.5, lean: .6, w: 1, side: -1 }));
    ctx.save(); ctx.clip(tc); for (let i = 0; i < 6; i++) { const y = -4 + i * 1.7; brush(ctx, new Shape().M(54, y).C(66, y - 1, 78, y + 1.5, 88, 3 + y * .3), alpha('#8a7a66', .45), .7, { taper: 'both' }); } ctx.restore();
    ink(ctx, tuft, inkFor('#c9b8a0', pal.ink), { w: 2, heavy: .4, jitter: .5, seed: 133, taper: 'start', wobble: .4, step: 1.4 });
    // ink drip at the tip
    ctx.fillStyle = pal.ink; ctx.beginPath(); ctx.ellipse(91, 8, 1.6, 2.3, .3, 0, TAU); ctx.fill();
  });
});

/* =====================================================================
   PALETTES, GENOME, RENDERER
   ===================================================================== */
const PALETTES = {
  momo:   { body: '#FF9E80', shade: '#EC7A5C', ink: '#3A1208' },
  matcha: { body: '#B9D77A', shade: '#8FB85A', ink: '#1E2A0C' },
  sakura: { body: '#FFC7D9', shade: '#F39BB8', ink: '#3B1224' },
  ramune: { body: '#8FD3F4', shade: '#5FB2DE', ink: '#0F2436' },
  yuzu:   { body: '#FFD966', shade: '#E8B43A', ink: '#3A2A08' },
};
const SLOTS = { eyes: drawEyes, mouth: drawMouth, ears: drawEars, horn: drawHorn, back: drawBack, tail: drawTail };
const EDGES = ['smooth', 'fuzzy', 'wool'];
let genome = {
  palette: { ...PALETTES.momo },
  bodyEdge: 'fuzzy',
  eyes: 'smugHalfLid', mouth: 'catFang', ears: 'calyxLeaf', horn: 'persimmon', back: 'kagamiMochi', tail: 'sparkler',
  seed: 7,
};
function expandPalette(p) { return Object.assign({}, p, { inkBody: inkFor(p.body, p.ink), inkFace: mix(p.ink, '#000', .25), iris: adjust(mix(p.ink, p.shade, .5), -.05, .15) }); }

const canvas = document.getElementById('tama');
const ctx = canvas.getContext('2d');
const reducedMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
let reduced = reducedMQ.matches; reducedMQ.addEventListener?.('change', e => { reduced = e.matches; });
const VIEW = { w: 600, h: 560, cx: 290, cy: 326, scale: 1.58 };
const PART_SCALE = 1.27;   // parts are drawn in anchor space scaled by this (keeps them balanced on any body)
function fitCanvas() {
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const cssW = Math.min(600, canvas.parentElement.clientWidth || 600);
  const cssH = Math.round(cssW * VIEW.h / VIEW.w);
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  VIEW.k = canvas.width / VIEW.w;
}
window.addEventListener('resize', fitCanvas); fitCanvas();

/* ---------- animation state ---------- */
const pose = { blink: 0, squint: 0, tight: false, ear: 0, tail: 0, horn: 0, sx: 1, sy: 1, rot: 0, dy: 0, mouthOverride: null };
const spring = (k, d) => ({ x: 0, v: 0, k, d, step(dt, input) { const a = -this.k * this.x - this.d * this.v + input; this.v += a * dt; this.x += this.v * dt; return this.x; } });
const earSpring = spring(140, 9), tailSpring = spring(90, 7), hornSpring = spring(120, 8);
let nextBlink = 2.2, blinkT = -1;
const sneeze = { active: false, t0: 0, freezeFrames: 0, stars: [] };
const DEBUG = { tau: null, ms: 0 };
let lastSy = 1, lastTime = performance.now();

function sneezeTimeline(tau) {
  // returns {sy, sx, rot, squint, mouth, tight, burst}
  const amp = reduced ? 0 : 1;
  const b = [[0, .34], [.42, .34], [.84, .34]]; // three build-ups: start, duration
  for (let i = 0; i < 3; i++) {
    const [s, d] = b[i]; if (tau >= s && tau < s + d) {
      const u = (tau - s) / d; const peak = 1 + (.05 + .045 * i) * amp;
      const sy = u < .18 ? lerp(1, 1 - .03 * amp, smooth(u / .18)) : lerp(1 - .03 * amp, peak, smooth((u - .18) / .82));
      return { sy, sx: 1 - (sy - 1) * .6, rot: (.03 + .025 * i) * amp * smooth((u - .18) / .82), squint: .35 + .2 * i, mouth: { w: 3.2 + i * 1.2, h: 2.6 + i * 1.6 }, tight: false };
    }
  }
  if (tau < 1.18) return null; // handled by the freeze
  const u = tau - 1.18;
  if (u < .09) { const k = smooth(u / .09); return { sy: lerp(1 + .14 * amp, 1 - .28 * amp, k), sx: lerp(1 - .084 * amp, 1 + .22 * amp, k), rot: lerp(.08 * amp, -.12 * amp, k), squint: 1, tight: true, mouth: { w: 7, h: 6 }, burst: u > .04 }; }
  const v = u - .09; // recoil: damped spring back to 1
  const e = Math.exp(-v * 5.5) * amp; const osc = Math.cos(v * 17);
  return { sy: 1 - .28 * e * osc, sx: 1 + .22 * e * osc, rot: -.12 * amp * Math.exp(-v * 6) * Math.cos(v * 14), squint: clamp(1 - v * 1.6, 0, 1), tight: v < .35, mouth: v < .5 ? { w: 6 - v * 6, h: 5 - v * 6 } : null, done: v > 1.1 };
}
function spawnStars(a) {
  const r = rng(Math.floor(performance.now())); const m = a.face.mouth;
  for (let i = 0; i < 11; i++) { const ang = Math.PI + (r() - .5) * 1.6; const sp = reduced ? 0 : 90 + r() * 160; sneeze.stars.push({ x: m.x - 8 + (reduced ? (r() - .5) * 50 : 0), y: m.y - 2 + (reduced ? (r() - .5) * 40 : 0), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 30, r: 3 + r() * 4.5, rot: r() * TAU, w: (r() - .5) * 8, life: .6 + r() * .45, age: 0, dot: r() < .3 }); }
}
function triggerSneeze() { if (sneeze.active) return; sneeze.active = true; sneeze.t0 = performance.now() / 1000; sneeze.freezeFrames = 0; sneeze.burstDone = false; }

function frame(now) {
  const f0 = performance.now();
  const t = now / 1000; const dt = clamp((now - lastTime) / 1000, 0, .05); lastTime = now;
  const pal = expandPalette(genome.palette); CUR_PAL = pal;
  const anchors = makeAnchors();
  // ----- idle: breathing, blink
  let sy = 1, sx = 1, rot = 0, squint = 0, tight = false, mouthOverride = null;
  if (!reduced) { const br = Math.sin(t * TAU / 3.4); sy = 1 + .016 * br; sx = 1 - .009 * br; }
  if (blinkT < 0 && t > nextBlink) { blinkT = t; nextBlink = t + 2.4 + Math.random() * 1.6 + (Math.random() < .2 ? -1.9 : 0); }
  let blink = 0; if (blinkT >= 0) { const u = (t - blinkT) / .15; blink = u < .5 ? smooth(u * 2) : 1 - smooth((u - .5) * 2); if (u >= 1) { blink = 0; blinkT = -1; } }
  // ----- sneeze
  if (sneeze.active) {
    let tau = t - sneeze.t0; let st;
    if (DEBUG.tau != null) tau = DEBUG.tau;
    const amp = reduced ? 0 : 1;
    if (tau >= 1.18 && tau < 1.18 + 1e-3 || (DEBUG.tau == null && tau >= 1.18 && sneeze.freezeFrames < 2)) { if (DEBUG.tau == null) { sneeze.freezeFrames++; sneeze.t0 += dt; } tau = 1.18 - 1e-4; st = { sy: 1 + .14 * amp, sx: 1 - .084 * amp, rot: .08 * amp, squint: .8, mouth: { w: 6, h: 6 }, tight: false }; }
    else st = sneezeTimeline(tau);
    if (st) {
      sy = st.sy; sx = st.sx; rot = st.rot; squint = st.squint; tight = !!st.tight; mouthOverride = st.mouth;
      if (st.burst && !sneeze.burstDone) { sneeze.burstDone = true; spawnStars(anchors); earSpring.v -= 9; tailSpring.v += 12; hornSpring.v -= 7; }
      if (st.done && DEBUG.tau == null) sneeze.active = false;
    }
  }
  // ----- follow-through springs driven by vertical motion of the body
  const vy = (sy - lastSy) / Math.max(dt, 1e-3); lastSy = sy;
  const input = reduced ? 0 : -vy * 6;
  const sway = reduced ? 0 : Math.sin(t * 1.1) * .035;
  pose.ear = clamp(earSpring.step(dt, input), -.9, .9) + sway * .6;
  pose.tail = clamp(tailSpring.step(dt, input * 1.4), -.9, .9) + sway;
  pose.horn = clamp(hornSpring.step(dt, input * .8), -.6, .6) + sway * .4;
  Object.assign(pose, { blink, squint, tight, sx, sy, rot, mouthOverride });
  anchors.pose = pose; anchors.reduced = reduced;

  // ----- draw
  const k = VIEW.k;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(k, k);
  // paper + ground shadow
  const gsq = 1 + (sx - 1) * .6;
  ctx.save(); ctx.translate(VIEW.cx, VIEW.cy + 84 * VIEW.scale + 6); ctx.scale(gsq, 1); softEllipse(ctx, 0, 0, 150 * VIEW.scale * .9, 13 * VIEW.scale, '#4a2e20', .24, .3); ctx.restore();
  ctx.translate(VIEW.cx, VIEW.cy); ctx.scale(VIEW.scale, VIEW.scale);
  // squash and stretch around the ground contact, tilt around the same point
  ctx.translate(0, 84); ctx.rotate(rot); ctx.scale(sx, sy); ctx.translate(0, -84);

  const parts = {}; for (const slot in SLOTS) parts[slot] = SLOTS[slot][genome[slot]];
  const seats = [];
  const addSeat = (an, meta) => { if (meta?.seat) { const k = PART_SCALE, ry = meta.seat.ry * k; seats.push({ x: an.x - an.nx * ry * .5, y: an.y - an.ny * ry * .5, rx: meta.seat.rx * k, ry, a: meta.seat.a, rot: an.ang + Math.PI / 2 }); } };
  addSeat(anchors.horn, parts.horn); addSeat(anchors.topRear, parts.back); addSeat(anchors.rear, parts.tail); addSeat(anchors.headSide, parts.ears);

  // behind the body: tail, back part, far ear, far leg
  parts.tail(ctx, anchors, pal, t);
  parts.back(ctx, anchors, pal, t);
  anchors.pass = 'behind'; parts.ears(ctx, anchors, pal, t);
  drawLeg(ctx, anchors.legs[1], pal);
  // the body itself (with seat shades, edge texture, ink)
  const bodyClip = drawBody(ctx, genome, pal, anchors, seats, pose);
  drawLeg(ctx, anchors.legs[0], pal); drawLeg(ctx, anchors.legs[2], pal);
  // front parts
  parts.horn(ctx, anchors, pal, t);
  anchors.pass = 'front'; parts.ears(ctx, anchors, pal, t);
  // face: blush, eyes, mouth
  ctx.save(); ctx.clip(bodyClip); softEllipse(ctx, anchors.face.cheekF.x, anchors.face.cheekF.y, 9, 5.5, pal.shade, .55, .4); softEllipse(ctx, anchors.face.cheekB.x, anchors.face.cheekB.y, 8, 5, pal.shade, .5, .4); ctx.restore();
  for (const c of [anchors.face.cheekF, anchors.face.cheekB]) for (let i = 0; i < 2; i++) brush(ctx, new Shape().M(c.x - 3 + i * 4, c.y - 2.5).L(c.x - 5 + i * 4, c.y + 2.5), alpha(pal.inkBody, .45), 1.2);
  parts.eyes(ctx, anchors, pal, t);
  if (mouthOverride) openMouth(ctx, pal, anchors.face.mouth.x - 1, anchors.face.mouth.y + 1, mouthOverride.w, mouthOverride.h, mouthOverride.h > 3.5);
  else parts.mouth(ctx, anchors, pal, t);
  // a faint glaze of the body colour over everything drawn so far ties the parts to the palette
  ctx.save(); ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = alpha(pal.body, .035); ctx.fillRect(-400, -400, 800, 800); ctx.restore();
  // sneeze stars (drawn in body space so they ride the squash a little, then settle)
  for (let i = sneeze.stars.length - 1; i >= 0; i--) {
    const s = sneeze.stars[i]; s.age += dt; if (s.age > s.life) { sneeze.stars.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt; s.vx *= (1 - 2.5 * dt); s.rot += s.w * dt;
    const a = 1 - smooth((s.age / s.life - .55) / .45); ctx.fillStyle = alpha(pal.ink, a);
    if (s.dot) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r * .35, 0, TAU); ctx.fill(); } else star4(ctx, s.x, s.y, s.r, s.rot);
  }
  DEBUG.ms = DEBUG.ms * .9 + (performance.now() - f0) * .1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => { const el = document.getElementById('stats'); if (el) el.textContent = `draw ${DEBUG.ms.toFixed(2)} ms/frame`; }, 500);

/* ---------- controls ---------- */
const slotsEl = document.getElementById('slots'), palEl = document.getElementById('palettes'), out = document.getElementById('genomeOut');
function cycle(slot) { const names = Object.keys(SLOTS[slot]); genome[slot] = names[(names.indexOf(genome[slot]) + 1) % names.length]; refresh(); }
function randomise() {
  for (const slot in SLOTS) { const names = Object.keys(SLOTS[slot]); genome[slot] = names[Math.floor(Math.random() * names.length)]; }
  genome.bodyEdge = EDGES[Math.floor(Math.random() * EDGES.length)];
  const pk = Object.keys(PALETTES); genome.palette = { ...PALETTES[pk[Math.floor(Math.random() * pk.length)]] };
  genome.seed = Math.floor(Math.random() * 1e6); refresh();
}
function refresh() {
  slotsEl.innerHTML = '';
  for (const slot in SLOTS) { const b = document.createElement('button'); b.innerHTML = `<small>${slot}</small>${genome[slot]}`; b.onclick = () => cycle(slot); slotsEl.appendChild(b); }
  const e = document.createElement('button'); e.innerHTML = `<small>edge</small>${genome.bodyEdge}`; e.onclick = () => { genome.bodyEdge = EDGES[(EDGES.indexOf(genome.bodyEdge) + 1) % EDGES.length]; refresh(); }; slotsEl.appendChild(e);
  const s = document.createElement('button'); s.innerHTML = `<small>ink</small>reseed`; s.onclick = () => { genome.seed = Math.floor(Math.random() * 1e6); refresh(); }; slotsEl.appendChild(s);
  palEl.innerHTML = '';
  for (const name in PALETTES) { const p = PALETTES[name]; const b = document.createElement('button'); b.className = 'swatch' + (p.body === genome.palette.body ? ' on' : ''); b.title = name; b.style.background = `linear-gradient(135deg, ${p.body} 55%, ${p.shade} 56%)`; b.onclick = () => { genome.palette = { ...p }; refresh(); }; palEl.appendChild(b); }
  const { seed, ...g } = genome; out.textContent = JSON.stringify(g, null, 2);
  if (MEMO.size > 400) MEMO.clear();
}
document.getElementById('randomise').onclick = randomise;
document.getElementById('sneeze').onclick = triggerSneeze;
canvas.addEventListener('pointerdown', triggerSneeze);
refresh();
// expose for tooling
window.Tama = { genome, set(g) { Object.assign(genome, g); refresh(); }, sneeze: triggerSneeze, randomise, PALETTES, SLOTS, DEBUG,
  freezeAt(tau) { DEBUG.tau = tau; if (tau == null) { sneeze.active = false; sneeze.stars.length = 0; } else { sneeze.active = true; sneeze.t0 = performance.now() / 1000; } } };
</script>
